name: Aktualizace dat ČSÚ

# ČSÚ zveřejňuje index spotřebitelských cen obvykle kolem 10. dne měsíce.
# Běh 11.–15. den v měsíci pokryje i posunutí kvůli svátkům; commit vznikne jen při změně dat.
on:
  schedule:
    - cron: '17 7 11-15 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-cpi
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Stáhnout data z ČSÚ
        run: node scripts/update-cpi.mjs

      - name: Testy
        env:
          REQUIRE_CPI_DATA: '1'
        run: node --test

      - name: Commit změněných dat
        run: |
          if git diff --quiet -- data/cpi.json && git ls-files --error-unmatch data/cpi.json >/dev/null 2>&1; then
            echo "Data se nezměnila."
            exit 0
          fi
          last=$(node -e "const d=require('./data/cpi.json');console.log(Object.keys(d).sort().at(-1))")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cpi.json
          git commit -m "Data ČSÚ: index spotřebitelských cen do ${last}"
          git push
